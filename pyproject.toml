[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afterglow-movie-recommender"
version = "0.1.0"
description = "Mood-aware movie recommendation application"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.2.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.25.0"
]
